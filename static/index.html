<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhishGuard – Fake Website Detector</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--ac:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:820px;margin:0 auto;padding:24px 16px}h1{margin:0 0 4px}p.sub{color:var(--mut);margin-top:0}
.card{background:var(--card);border-radius:12px;padding:16px;margin:16px 0}
input,textarea,button{font:inherit;border-radius:8px;border:1px solid #334155;background:#0b1220;color:var(--tx);padding:10px}
input,textarea{width:100%}button{background:var(--ac);color:#06202e;border:0;font-weight:600;cursor:pointer;padding:10px 18px}
button.sec{background:#334155;color:var(--tx)}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:220px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;color:#06202e}
.bar{height:10px;background:#334155;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%}
.f{border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;background:#0b1220;border-radius:6px}
.f small{color:var(--mut);display:block}.ex a{color:var(--ac);cursor:pointer;margin-right:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #334155;text-align:left;font-size:14px}
</style></head><body><main>
<h1>🛡️ PhishGuard</h1><p class="sub">Paste a link. We explain why it may be a fake or impersonation site. We never log what you scan.</p>
<div class="card"><div class="row"><input id="url" placeholder="e.g. paypa1-secure-login.xyz/verify"><button onclick="scan()">Analyze</button></div>
<p class="ex">Safe test examples:
<a onclick="t('https://www.google.com')">google.com</a><a onclick="t('paypa1-secure-login.xyz/verify')">paypal typo</a>
<a onclick="t('http://amazon-india.support/account/update')">amazon fake</a><a onclick="t('https://rnicrosoft.com')">microsoft typo</a>
<a onclick="t('http://google.com@evil.tk')">@ trick</a></p></div>
<div id="out"></div>
<div class="card"><h3>Admin review queue</h3><div class="row"><input id="tok" type="password" placeholder="admin token"><button class="sec" onclick="load()">Load reports</button></div><div id="q"></div></div>
</main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(u){$('url').value=u;scan()}
const col=v=>v=='High risk'?'var(--bad)':v=='Suspicious'?'var(--warn)':'var(--ok)';
async function scan(){const url=$('url').value;if(!url)return;$('out').innerHTML='<div class="card">Analyzing…</div>';
 const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
 if(!r.ok){$('out').innerHTML='<div class="card">Invalid input.</div>';return}
 const d=await r.json();
 $('out').innerHTML=`<div class="card"><span class="badge" style="background:${col(d.verdict)}">${d.verdict}</span> <b>${d.score}/100</b> · ${esc(d.domain)}
 <div class="bar"><i style="width:${d.score}%;background:${col(d.verdict)}"></i></div><p>${esc(d.advice)}</p>
 ${d.findings.length?d.findings.map(x=>`<div class="f"><b>${esc(x.title)}</b> (+${x.points})<br>${esc(x.detail)}<small>Source: ${esc(x.source)}</small></div>`).join(''):'<p>No suspicious indicators found.</p>'}
 ${d.page.note?`<small>${esc(d.page.note)}</small>`:''}
 <p><button class="sec" onclick="rep()">🚩 Report this site</button></p></div>`}
async function rep(){const n=prompt('Optional note (what happened?)')||'';
 const r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value,note:n})});alert((await r.json()).message)}
async function load(){const r=await fetch('/api/reports',{headers:{'x-admin-token':$('tok').value}});
 if(!r.ok){$('q').innerHTML='Wrong token';return}const d=await r.json();
 $('q').innerHTML='<table><tr><th>URL</th><th>Score</th><th>Status</th><th>Action</th></tr>'+d.map(x=>`<tr><td>${esc(x.url)}</td><td>${x.score}</td><td>${x.status}</td>
 <td><button class="sec" onclick="rv(${x.id},'confirmed_phishing')">Confirm</button> <button class="sec" onclick="rv(${x.id},'false_positive')">False +</button></td></tr>`).join('')+'</table>'}
async function rv(id,s){await fetch('/api/reports/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':$('tok').value},body:JSON.stringify({status:s})});load()}
</script></body></html>
